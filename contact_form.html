<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>きたむらミュージックスクールのコンタクトフォーム</title>
    <meta name="description" content="きたむらミュージックスクールのコンタクトフォームのページです。">
    <meta name="keywords" content="ミュージックスクール, コンタクトフォーム、お問い合わせ">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://code.jquery.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="icon" href="../img/header-logo_pc.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js" defer></script>
    <script src="./js/script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div id="container">
        <header class="l-header">
            <div class="l-inner">
                <h1 class="l-header__logo">
                    <a href="index.html">
                        <img src="./img/header-logo_sp.svg" alt="きたむらミュージックスクールロゴ">
                        <span class="l-header__title"><span class="l-header__title-main">きたむら</span><br
                                class="pc">ミュージックスクール</span>
                    </a>
                </h1>
                <nav class="l-header__nav pc js-nav">
                    <ul class="l-header__nav-list">
                        <li class="l-header__nav-item"><a href="plan.html">料金</a></li>
                        <li class="l-header__nav-item"><a href="blog-list.html">ブログ</a></li>
                        <li class="l-header__nav-item"><a href="result-list.html">卒業実績</a></li>
                        <li class="l-header__nav-item-btn"><a href="contact_form.html">お問い合わせ</a></li>
                    </ul>
                </nav>
                <button class="js-hamburger l-header__hamburger">
                    <span class="l-header__drawer-icon-bar"></span>
                    <span class="l-header__drawer-icon-bar"></span>
                    <span class="l-header__drawer-icon-bar"></span>
                </button>
                <div class="l-header__nav-menu sp">
                    <nav>
                        <ul>
                            <li class="l-header__nav-menu-item"><a href="plan.html">料金</a></li>
                            <li class="l-header__nav-menu-item"><a href="blog-list.html">ブログ</a></li>
                            <li class="l-header__nav-menu-item"><a href="result-list.html">卒業実績</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </header>
        <main class="main">
            <div class="c-kv">
                <picture>
                    <source media="(max-width: 767px)" srcset="../img/contact-kv_sp.webp">
                    <img src="../img/contact-kv_pc.webp" alt="楽譜とノートパソコンとヘッドホン">
                </picture>
                <div class="c-kv__overlay"></div>
                <div class="c-kv__catch">
                    <h2>お問い合わせ</h2>
                </div>
            </div>
            <div class="p-blog-list__breadcrumbs c-breadcrumbs">
                <div class="l-inner">
                    <nav>
                        <ol itemscope itemtype="http://schema.org/BreadcrumbList">
                            <li itemprop="itemListElement" itemscope itemtype="http://schema.org/ListItem">
                                <a itemprop="item" href="index.html"><span itemprop="name">ホーム</span></a>
                                <meta itemprop="position" content="1" />
                                <span class="c-breadcrumbs__arrow">&gt;</span>
                            </li>
                            <li itemprop="itemListElement" itemscope itemtype="http://schema.org/ListItem">
                                <a itemprop="item" href="contact_form.html"><span itemprop="name">お問い合わせ</span></a>
                                <meta itemprop="position" content="2" />

                            </li>

                        </ol>
                    </nav>
                </div>
            </div>
            <div id="contact-form" class="p-contact-form">
                <div class="l-inner">
                    <div class="p-contact-form__contents">
                        <div class="p-contact-form__text">
                            <p class="p-contact-form__heading">当校に関するご質問・ご相談・資料請求は下記のフォームからお気軽にお問い合わせください。<br>
                                通常３営業日以内にメールにてご連絡させていただきます。</p>
                        </div>
                        <div class="p-contact-form__block">
                            <form action="contact-send.html">
                                <dl class="p-contact-form__area">
                                    <dt>
                                        <label for="your-company">会社名</label>
                                    </dt>
                                    <dd>
                                        <input type="text" name="your-company" placeholder="きたむらミュージックスクール"
                                            id="your-company" class="form-control">
                                    </dd>
                                </dl>
                                <dl class="p-contact-form__area">
                                    <dt>
                                        <label for="your-name">お名前</label>
                                    </dt>
                                    <dd>
                                        <input type="text" name="your-name" placeholder="北村　翔平" id="your-name" class="form-control">
                                    </dd>
                                </dl>
                                <dl class="p-contact-form__area">
                                    <dt>
                                        <label for="your-email">メールアドレス</label>
                                    </dt>
                                    <dd>
                                        <input type="email" name="your-email" placeholder="info@kitamura.musicschool.jp"
                                            id="your-email" class="form-control">
                                    </dd>
                                </dl>
                                <dl class="p-contact-form__area">
                                    <dt>
                                        <label for="your-tel">電話番号</label>
                                    </dt>
                                    <dd>
                                        <input type="tel" name="your-tel" placeholder="090-1234-5678" id="your-tel"
                                            class="form-control">
                                    </dd>
                                </dl>
                                <div class="p-contact-form__purpose-area">
                                    <p class="p-contact-form__purpose">目　的　<br class="pc">(複数選択可)</p>
                                    <div class="p-contact-form__checkbox-area">
                                        <div class="p-contact-form__item form-item">
                                            <label class="form-item__checkbox">
                                                <input type="checkbox" name="purpose" class="form-item__input">
                                                <span class="form-item__text">プランについてのお問い合わせ</span>
                                            </label>
                                        </div>

                                        <div class="p-contact-form__item form-item">
                                            <label class="form-item__checkbox">
                                                <input type="checkbox" name="purpose" class="form-item__input">
                                                <span class="form-item__text">ヒアリングのご予約</span>
                                            </label>
                                        </div>
                                        <div class="p-contact-form__item form-item">
                                            <label class="form-item__checkbox">
                                                <input type="checkbox" name="purpose" class="form-item__input">
                                                <span class="form-item__text">資料請求</span>
                                            </label>
                                        </div>
                                        <div class="p-contact-form__item form-item">
                                            <label class="form-item__checkbox">
                                                <input type="checkbox" name="purpose" class="form-item__input">
                                                <span class="form-item__text">その他</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <dl class="p-contact-form__area">
                                    <dt>
                                        <label for="p-contact-form__content">内　容</label>
                                    </dt>
                                    <dd>
                                        <textarea name="content" id="p-contact-form__content"
                                            class="form-control content-form"
                                            placeholder="内容に関する詳細や備考等をご入力ください。"></textarea>
                                    </dd>
                                </dl>

                                <div class="p-contact-form__submit">

                                    <div class="c-submit p-contact-form__btn">
                                        <a href="contact-send.html" class="c-submit">送信</a>

                                    </div>
                                </div>
                            </form>
                        </div>






                        <a href="#" class="c-back-to-top" aria-label="トップへ戻る">
                            <img src="../img/arrow-top.svg" alt="トップへ戻るの矢印">
                        </a>
                        <div class="p-contact-form__submit-area">
                            <a href="contact_form.html" class="c-contact-btn">お問い合わせ</a>

                        </div>

                    </div>
                </div>
            </div>

        </main>
        <footer class="l-footer section-bg">
            <div class="l-inner">
                <div class="l-footer__contents">
                    <nav class="l-footer__nav">
                        <ul class="l-footer__nav-lists">
                            <li>
                                <a href="index.html" class="l-footer__nav-link">ホーム</a>
                            </li>
                            <li>
                                <a href="plan.html" class="l-footer__nav-link">料金</a>
                            </li>
                            <li>
                                <a href="blog-list.html" class="l-footer__nav-link">ブログ</a>
                            </li>
                            <li>
                                <a href="result-list.html" class="l-footer__nav-link">卒業実績</a>
                            </li>
                        </ul>
                    </nav>
                    <div class="l-footer__logo">
                        <a href="index.html">
                            <img src="./img/logo-white.svg" alt="きたむらミュージックスクールロゴ">
                        </a>
                    </div>
                    <div class="l-footer__copyright-area">
                        <p class="l-footer__copyright">
                            Copyright&copy;0000 KITAMURA music school Inc. <br class="sp">All Rights
                        </p>
                    </div>
                    <ul class="l-footer__sns">
                        <li>
                            <a href="#" class="l-footer__sns-link" target="_blank" rel="noopener noreferrer">
                                <img src="../img/twitter-icon.svg" alt="x">
                            </a>
                        </li>
                        <li>
                            <a href="#" class="l-footer__sns-link" target="_blank" rel="noopener noreferrer">
                                <img src="../img/fb-icon.svg" alt="facebook">
                            </a>
                        </li>
                        <li>
                            <a href="#" class="l-footer__sns-link" target="_blank" rel="noopener noreferrer">
                                <img src="../img/youtube-icon.svg" alt="youtube">
                            </a>
                        </li>
                        <li>
                            <a href="#" class="l-footer__sns-link" target="_blank" rel="noopener noreferrer">
                                <img src="../img/instagram-icon.svg" alt="instagram">
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </footer>
    </div>
</body>
